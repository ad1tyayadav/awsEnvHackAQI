# VayuAQI - the whole backend in one SAM template.
# Creates: 1 DynamoDB table (subscribers), 2 Lambdas (the 30-minute scheduler and
# the Telegram webhook), 1 HTTP API for the webhook route, 1 EventBridge rule,
# plus the IAM roles SAM generates for the two functions.
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: VayuAQI - automatic air-quality alerts on Telegram (AWS Bharat Build, Track 01 Air)

Parameters:
  OpenAQApiKey:
    Type: String
    NoEcho: true
    Description: OpenAQ v3 API key
  TelegramBotToken:
    Type: String
    NoEcho: true
    Description: Telegram bot token from @BotFather
    Default: ''
  TelegramWebhookSecret:
    Type: String
    NoEcho: true
    Description: Random secret sent in the X-Telegram-Bot-Api-Secret-Token header
    Default: ''
  Stage:
    Type: String
    Default: prod

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 60
    MemorySize: 256
    Handler: index.handler
    Architectures: [x86_64]
    Environment:
      Variables:
        STAGE: !Ref Stage
        OPENAQ_API_KEY: !Ref OpenAQApiKey
        TELEGRAM_BOT_TOKEN: !Ref TelegramBotToken
        TELEGRAM_WEBHOOK_SECRET: !Ref TelegramWebhookSecret

Resources:
  # One row per Telegram chat that pressed /start. Partition key is the chatId;
  # locKey (the chat's coordinates snapped to ~2 km) groups neighbours so the
  # scheduler can read OpenAQ once per neighbourhood.
  SubscribersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub cleanair-subscribers-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: chatId
          AttributeType: S
      KeySchema:
        - AttributeName: chatId
          KeyType: HASH

  # The scheduler: every 30 minutes, monitor each neighbourhood and alert on a rise.
  FetchAndEvaluateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/fetchAndEvaluate/
      FunctionName: !Sub cleanair-fetch-evaluate-${Stage}
      Environment:
        Variables:
          SUBSCRIBERS_TABLE: !Ref SubscribersTable
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref SubscribersTable }
    # Required: these are TypeScript sources. Without the esbuild build method
    # `sam build` would copy index.ts while the handler looks for index.js, and
    # the Lambda would fail at runtime with "Cannot find module".
    # Metadata is a resource attribute, so it sits beside Properties, not inside it.
    # Docs: serverless-sam-cli-using-build-typescript.html
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - index.ts
        Format: cjs
        Target: es2022
        Minify: false
        Sourcemap: false

  FetchScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub cleanair-fetch-30min-${Stage}
      ScheduleExpression: rate(30 minutes)
      State: ENABLED
      Targets:
        - Id: FetchAndEvaluateTarget
          Arn: !GetAtt FetchAndEvaluateFunction.Arn

  FetchScheduleLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FetchAndEvaluateFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt FetchScheduleRule.Arn

  # HTTP API: exists only to give Telegram an HTTPS endpoint for the webhook.
  # No browser client calls this, so there is no CORS configuration. Throttling
  # stays on so a rogue caller cannot run up the bill.
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  # The webhook: verifies Telegram's secret header, then routes the update.
  TelegramWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/telegramWebhook/
      FunctionName: !Sub cleanair-telegram-webhook-${Stage}
      Environment:
        Variables:
          SUBSCRIBERS_TABLE: !Ref SubscribersTable
      Policies:
        # Least privilege: this Lambda only reads and writes subscribers.
        - DynamoDBCrudPolicy: { TableName: !Ref SubscribersTable }
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /telegram/webhook
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - index.ts
        Format: cjs
        Target: es2022
        Minify: false
        Sourcemap: false

Outputs:
  ApiBaseUrl:
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  WebhookUrl:
    Description: Pass this as `url` to setWebhook (README, Deploy step 4)
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/telegram/webhook
  SchedulerFunctionName:
    Description: Invoke this by hand to test the automatic alert without waiting 30 minutes
    Value: !Ref FetchAndEvaluateFunction
