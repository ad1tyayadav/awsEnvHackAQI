# Clean Air Day-Planner for Schools - SAM template
# Creates: 4 DynamoDB tables, fetchAndEvaluate Lambda, (later phases add SNS, EventBridge, API GW)
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Clean Air Day-Planner for Schools (AWS Bharat Build, Track 01 Air)

Parameters:
  OpenAQApiKey:
    Type: String
    NoEcho: true
    Description: OpenAQ v3 API key
  Stage:
    Type: String
    Default: prod
  TelegramBotToken:
    Type: String
    NoEcho: true
    Description: Telegram bot token from @BotFather (task 9.1)
    Default: ''
  TelegramWebhookSecret:
    Type: String
    NoEcho: true
    Description: Random secret sent in X-Telegram-Bot-Api-Secret-Token header (task 9.1)
    Default: ''

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 60
    MemorySize: 256
    Handler: index.handler
    Architectures: [x86_64]
    Environment:
      Variables:
        STAGE: !Ref Stage
        OPENAQ_API_KEY: !Ref OpenAQApiKey
        TELEGRAM_BOT_TOKEN: !Ref TelegramBotToken
        TELEGRAM_WEBHOOK_SECRET: !Ref TelegramWebhookSecret

Resources:
  # DynamoDB tables (PRD section 8)
  SchoolsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub cleanair-schools-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: schoolId
          AttributeType: S
      KeySchema:
        - AttributeName: schoolId
          KeyType: HASH

  ReadingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub cleanair-readings-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: schoolId
          AttributeType: S
        - AttributeName: ts
          AttributeType: S
      KeySchema:
        - AttributeName: schoolId
          KeyType: HASH
        - AttributeName: ts
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  AdvisoryCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub cleanair-advisory-cache-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: key
          AttributeType: S
      KeySchema:
        - AttributeName: key
          KeyType: HASH

  AlertsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub cleanair-alerts-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: schoolId
          AttributeType: S
        - AttributeName: ts
          AttributeType: S
      KeySchema:
        - AttributeName: schoolId
          KeyType: HASH
        - AttributeName: ts
          KeyType: RANGE

  # SNS topic for air alerts (Phase 4)
  AirAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub cleanair-alerts-${Stage}

  FetchAndEvaluateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/fetchAndEvaluate/
      FunctionName: !Sub cleanair-fetch-evaluate-${Stage}
      Environment:
        Variables:
          SCHOOLS_TABLE: !Ref SchoolsTable
          READINGS_TABLE: !Ref ReadingsTable
          ADVISORY_TABLE: !Ref AdvisoryCacheTable
          ALERTS_TABLE: !Ref AlertsTable
          ALERT_TOPIC_ARN: !Ref AirAlertsTopic
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref SchoolsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ReadingsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AdvisoryCacheTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AlertsTable }
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: sns:Publish
              Resource: !Ref AirAlertsTopic

  # Phase 5: 30-minute schedule (PRD F2)
  FetchScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub cleanair-fetch-30min-${Stage}
      ScheduleExpression: rate(30 minutes)
      State: ENABLED
      Targets:
        - Id: FetchAndEvaluateTarget
          Arn: !GetAtt FetchAndEvaluateFunction.Arn

  FetchScheduleLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FetchAndEvaluateFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt FetchScheduleRule.Arn

  # Phase 5: HTTP API for the dashboard
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins: ['*'] # tightened to the Amplify domain in Phase 7
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [Content-Type]
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/api/
      FunctionName: !Sub cleanair-api-${Stage}
      Handler: index.handler
      Environment:
        Variables:
          SCHOOLS_TABLE: !Ref SchoolsTable
          READINGS_TABLE: !Ref ReadingsTable
          ADVISORY_TABLE: !Ref AdvisoryCacheTable
          ALERTS_TABLE: !Ref AlertsTable
          ALERT_TOPIC_ARN: !Ref AirAlertsTopic
          OPENAQ_API_KEY: !Ref OpenAQApiKey
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref SchoolsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ReadingsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AdvisoryCacheTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AlertsTable }
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: sns:Publish
              Resource: !Ref AirAlertsTopic

Outputs:
  FetchAndEvaluateArn:
    Value: !GetAtt FetchAndEvaluateFunction.Arn
  ApiBaseUrl:
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
